plugins {
    id 'java'
    id 'application' 
}

application {
    mainClass = 'src.Main'  // Полное имя класса
}

repositories {
    mavenCentral()  // Источник библиотек
   // jcenter()
}

dependencies {

implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.24.3'
implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.24.3'

   // implementation 'org.apache.logging.log4j:log4j-api:2.24.3'
   // implementation 'org.apache.logging.log4j:log4j-core:2.24.3'

    testImplementation 'org.junit:junit:4.13.2'
    testImplementation 'org.hamcrest:hamcrest-core:1.3'
}

System.setProperty('javax.net.ssl.trustStore', '/usr/lib/jvm/java-1.21.0-openjdk-amd64/lib/security/cacerts')


test {
    useJUnit()  
}


